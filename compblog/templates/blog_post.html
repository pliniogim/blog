{% extends "base.html" %}

{% block content %}
    <div class="container mt-4">
        <h1>{{ post.title }}</h1>
        <h2 class="text-muted">Written by: {{ post.author.username }}</h2>
        <h3 class="text-muted">Created on: {{ post.date.strftime('%B %d, %Y') }}</h3>
        <p>{{ post.text }}</p>

        {% if post.author == current_user %}
        <div>
            <a href="{{ url_for('blog_posts.update', blog_post_id=post.id) }}" class="btn btn-outline-info">Update</a>
            <button class="btn btn-outline-danger">Delete</button>
        </div
        {% endif %}

    </div>
{% endblock %}
