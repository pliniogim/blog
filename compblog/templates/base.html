<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css')}}">
    <script src="{{ url_for('static', filename='js/bootstrap.js')}}"></script>

    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
<div class="container">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link link-light" href="{{url_for('core.index')}}">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link link-light" href="{{url_for('core.info')}}">About</a>
      </li>

      {% if current_user.is_authenticated %}

        <li class="nav-item">
          <a class="nav-link link-light" href="{{url_for('users.logout')}}">Log Out</a>
        </li>
        <li class="nav-item">
          <a class="nav-link link-light" href="{{url_for('users.account')}}">Account</a>
        </li>
        <li class="nav-item">
          <a class="nav-link link-light" href="#">Create Post</a>
        </li>

      {% else %}
        <li class="nav-item">
          <a class="nav-link link-light" href="{{url_for('users.login')}}">Log In</a>
        </li>
        <li class="nav-item">
          <a class="nav-link link-light" href="{{url_for('users.register')}}">Register</a>
        </li>
      {% endif %}
    </ul>
  </div>
  <br />
  <br />
<div class="container">
  {% block content %}

  {% endblock %}
</div>


  </body>
</html>
